<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalori AI</title>
<style>
body{font-family:Arial;background:#f3f5f7;margin:0;padding:16px;color:#222}
.app{max-width:600px;margin:auto}
.card{background:white;padding:18px;margin-bottom:14px;border-radius:16px}
h1{text-align:center}
input,button{width:100%;padding:14px;margin-top:8px;border-radius:10px;box-sizing:border-box;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#1677ff;color:white;font-weight:bold}
.result{margin-top:12px;font-size:17px}
.small{color:#666;font-size:13px}
</style>
</head>

<body>
<div class="app">

<h1>🍎 Kalori AI</h1>

<div class="card">
<b>Bugünkü hedef</b>
<h2>1800 kcal</h2>
<div id="summary">Alınan: 0 kcal</div>
</div>

<div class="card">
<h2>🍳 Ne yedin?</h2>

<input id="food"
placeholder="Örn: 3 yumurta veya 1 tabak makarna">

<button onclick="analyzeFood()">🤖 AI ile Hesapla</button>

<div id="foodResult" class="result"></div>
 <button id="addFoodBtn" onclick="addFoodToDaily()" style="display:none">➕ Günlüğe Ekle</button>
</div>

<div class="card">
<h2>📷 Yemek fotoğrafı</h2>

<input id="photo"
type="file"
accept="image/*"
capture="environment">

<button onclick="analyzePhoto()">📸 Fotoğrafı AI ile Analiz Et</button>

<div id="photoResult" class="result"></div>
<button id="addPhotoBtn" onclick="addPhotoToDaily()" style="display:none">➕ Fotoğrafı Günlüğe Ekle</button>
<p class="small">
AI tahmini yaklaşık değerdir.
</p>
</div>

<div class="card">
<h2>🚶 Adım</h2>

<input id="steps"
type="number"
placeholder="Bugünkü adım sayısı">

<button onclick="calcSteps()">Hesapla</button>

<div id="stepResult" class="result"></div>
</div>

</div>

<script>

const API =
"https://calori-ai.wustafaakbas.workers.dev";

let totalCalories =
Number(localStorage.getItem("totalCalories") || 0);

updateSummary();

function updateSummary(){
 document.getElementById("summary").innerText =
 "Alınan: "+Math.round(totalCalories)+" kcal • Kalan: "+
 Math.max(0,1800-Math.round(totalCalories))+" kcal";
}

async function analyzeFood(){

 const food =
 document.getElementById("food").value.trim();

 const result =
 document.getElementById("foodResult");

 if(!food){
   result.innerText="Önce ne yediğini yaz.";
   return;
 }

 result.innerText="🤖 AI hesaplıyor...";

 try{

 const r=await fetch(API,{
   method:"POST",
   headers:{
     "Content-Type":"application/json"
   },
   body:JSON.stringify({
     type:"text",
     text:food
   })
 });

 const data=await r.json();

 if(!r.ok)
   throw new Error(data.error || "API hatası");

 const kcal=Number(data.calories ?? data.kcal);

 if(!Number.isFinite(kcal))
   throw new Error("Kalori bilgisi alınamadı.");

 
lastFoodCalories = Math.round(kcal);
lastFoodName = food;
document.getElementById("addFoodBtn").style.display = "block";
 

 result.innerText=
   "🔥 "+food+": yaklaşık "+Math.round(kcal)+" kcal";

 updateSummary();

 }catch(e){

 result.innerText=
   "❌ Hata: "+e.message;

 }

}

async function analyzePhoto(){

 const file =
 document.getElementById("photo").files[0];

 const result =
 document.getElementById("photoResult");

 if(!file){
   result.innerText="Önce fotoğraf seç.";
   return;
 }

 result.innerText=
 "📸 Fotoğraf AI tarafından inceleniyor...";

 try{

 const base64 =
 await fileToBase64(file);

 const r=await fetch(API,{
   method:"POST",
   headers:{
     "Content-Type":"application/json"
   },
   body:JSON.stringify({
     type:"image",
     image:base64
   })
 });

 const data=await r.json();

 if(!r.ok)
   throw new Error(data.error || "API hatası");

 const kcal=Number(data.calories ?? data.kcal);

 if(!Number.isFinite(kcal))
   throw new Error("Kalori bilgisi alınamadı.");

 
lastPhotoCalories = Math.round(kcal);
lastPhotoName = data.food || "Yemek";
document.getElementById("addPhotoBtn").style.display = "block";
 

 result.innerText=
 "🍽️ "+(data.food || "Yemek")+
 ": yaklaşık "+Math.round(kcal)+" kcal";

 updateSummary();

 }catch(e){

 result.innerText=
 "❌ Hata: "+e.message;

 }

}

function fileToBase64(file){

 return new Promise((resolve,reject)=>{

   const reader=new FileReader();

   reader.onload=()=>{
     resolve(reader.result);
   };

   reader.onerror=reject;

   reader.readAsDataURL(file);

 });

}

function calcSteps(){

 const steps=
 Number(document.getElementById("steps").value);

 if(!steps) return;

 const burned=
 steps*91*0.00045;

 document.getElementById("stepResult").innerText=
 "🔥 Yaklaşık "+Math.round(burned)+" kcal harcadın.";

}
let lastFoodCalories = 0;
let lastFoodName = "";

function addFoodToDaily() {
  if (!lastFoodCalories) return;

 totalCalories += lastFoodCalories;
localStorage.setItem("totalCalories", totalCalories);

  alert(lastFoodName + " günlüğe eklendi: " + lastFoodCalories + " kcal");
  location.reload();
}
 let lastPhotoCalories = 0;
let lastPhotoName = "";

function addPhotoToDaily() {
  if (!lastPhotoCalories) return;

  totalCalories += lastPhotoCalories;
  localStorage.setItem("totalCalories", totalCalories);

  alert(lastPhotoName + " günlüğe eklendi: " + lastPhotoCalories + " kcal");
  location.reload();
}
</script>
</body>
</html>
